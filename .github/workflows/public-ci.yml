name: Public Repository Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-snapshot:
    name: public-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the complete public history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r automation/requirements.txt

      - name: Validate the public repository boundary
        run: python automation/validate_public_repository.py

      - name: Compile Python sources
        run: python -m compileall -q automation

      - name: Run the public-compatible unit suite
        run: python automation/run_public_tests.py
