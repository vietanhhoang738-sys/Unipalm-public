name: Architecture & Contract Guard

on:
  push:
    branches:
      - multi-shop-catalog-resolver
    paths:
      - "automation/**"
      - "config/**"
      - "ops/**"
      - "docs/**"
      - "UNIPALM_PROJECT_CONSTITUTION.md"
      - "README.md"
      - ".github/workflows/architecture-contract-guard.yml"
  pull_request:
    paths:
      - "automation/**"
      - "config/**"
      - "ops/**"
      - "docs/**"
      - "UNIPALM_PROJECT_CONSTITUTION.md"
      - "README.md"
      - ".github/workflows/architecture-contract-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-contract-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install dependencies
        run: pip install -r automation/requirements.txt
      - name: Compile complete automation surface
        run: python -m compileall -q automation
      - name: Validate architecture registry and boundaries
        run: python automation/validate_architecture.py
      - name: Run repository unit tests
        working-directory: automation
        run: python -m unittest discover -s tests -p "test_*.py" -v
