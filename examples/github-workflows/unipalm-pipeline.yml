name: Unipalm Production Pipeline

# Public source snapshot: scheduled production execution is intentionally disabled.
on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild and republish even if reliable end is unchanged"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Validate upstream + candidate mart only, do not write/publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: unipalm-production-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    # Explicit opt-in is required even for manual dispatch in a public clone.
    if: ${{ vars.UNIPALM_PUBLIC_PRODUCTION_ENABLE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UNIPALM_STATE_SHEET_ID: "PUBLIC_RESOURCE_LIVE_002"
      UNIPALM_DATA_MART_SHEET_ID: "PUBLIC_RESOURCE_LIVE_001"
      UNIPALM_CONTROL_CENTER_SHEET_ID: "PUBLIC_RESOURCE_LIVE_004"
      UNIPALM_SKU_MASTER_SHEET_ID: "PUBLIC_RESOURCE_LIVE_003"
      UNIPALM_PRODUCTION_URL: "https://example.invalid/"
      FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      UNIPALM_DASHBOARD_ACCESS_KEY: ${{ secrets.UNIPALM_DASHBOARD_ACCESS_KEY }}
      GOOGLE_DRIVE_SOURCE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_SOURCE_FOLDER_ID }}

    steps:
      - name: Checkout production repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r automation/requirements.txt

      - name: Validate required secrets
        run: python automation/validate_config.py

      - name: Validate Command Center V2 UI layer
        run: |
          python automation/validate_ui_v2_template.py
          cd automation
          python -m unittest discover -s tests -p "test_ui_artifact.py" -v
          cd ..

      - name: Run Unipalm pipeline
        id: run_pipeline
        run: python automation/run_pipeline.py

      - name: Commit production artifact when publish is required
        if: steps.run_pipeline.outputs.publish_required == 'true'
        env:
          # Vercel Hobby + private repo requires the Git commit author to be
          # the owner of the Hobby team/project. Attribute automated commits
          # to the repository owner using GitHub's canonical noreply identity.
          UNIPALM_GIT_AUTHOR_NAME: ${{ github.repository_owner }}
          UNIPALM_GIT_AUTHOR_EMAIL: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
        run: |
          git config user.name "$UNIPALM_GIT_AUTHOR_NAME"
          git config user.email "$UNIPALM_GIT_AUTHOR_EMAIL"
          git add index.html automation/pipeline_state.json
          if git diff --cached --quiet; then
            echo "Expected a publish artifact but no staged diff exists."
            exit 1
          fi
          git commit -m "chore(data): Unipalm automated refresh through ${{ steps.run_pipeline.outputs.candidate_reliable_end }}"
          git push
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify fixed Vercel URL and finalize state
        if: steps.run_pipeline.outputs.publish_required == 'true'
        run: python automation/verify_deploy.py
